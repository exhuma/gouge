[project]
name = "gouge"
version = "2.2.5"
description = "Colourful console and structured log formatters for the Python logging module"
authors = [{ name = "Michel Albert", email = "michel@albert.lu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.11"
keywords = ["logging", "formatter", "colour", "console", "ansi", "colorama"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "colorama>=0.4.6",
]

[project.urls]
Homepage = "https://github.com/exhuma/gouge"
Repository = "https://github.com/exhuma/gouge"
Documentation = "https://exhuma.github.io/gouge/"
Changelog = "https://exhuma.github.io/gouge/changelog.html"
Issues = "https://github.com/exhuma/gouge/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gouge"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.rst", "/LICENSE"]

[dependency-groups]
dev = [
    "furo",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "sphinx>=8.0",
    "types-colorama",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=gouge",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "G", "LOG", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["gouge"]
